[project]
name = "cryptodash"
version = "0.1.0"
description = "Personal crypto-macro analysis dashboard (free data sources only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Dependencies are grouped by roadmap phase (see CLAUDE.md section 8).
# Only Phase 0/1 runtime deps are declared as required so the scaffold stays
# installable before later ingesters exist. Ask before adding new deps (section 11).
# Upper bounds cap the next major to avoid silent breakage on a fresh install: e.g.
# pandas 3.0 broke Altair's DataFrame serialization (worked around in app/dashboard.py).
dependencies = [
    "pyyaml>=6.0,<7",        # config/settings.yaml
    "python-dotenv>=1.0,<2", # load config/.env
    "requests>=2.31,<3",     # coingecko / defillama / FRED REST (phase 1)
    "pandas>=2.1,<4",        # transforms + fetch() DataFrame contract (3.x supported)
    "numpy>=1.26,<3",        # indicators
]
# NOTE: FRED is accessed via its REST endpoint directly (ingest/fred.py) rather
# than the `fredapi` wrapper, because we need output_type=4 (initial release only)
# for point-in-time release dates (section 9) and per-window bisection to stay under
# FRED's 2000-vintage-date limit on daily series — neither of which fredapi supports.

[project.optional-dependencies]
# Phase 2+ ingest (derivatives, scraping) — not needed for the scaffold.
markets = [
    "ccxt>=4.2,<5",         # funding + open interest
    "lxml>=5.0,<6",         # pandas.read_html backend for scrapers
    "websockets>=12.0,<16", # binance liquidations stream
]
# Dashboard (phase 1 UI). Altair is declared explicitly (we build charts with it in
# app/dashboard.py) rather than relying on Streamlit's transitive pin.
app = [
    "streamlit>=1.30,<2",
    "altair>=5,<7",
]
# PostgreSQL backend (phase 4: cloud deploy / hosted DB via DATABASE_URL).
postgres = [
    "psycopg[binary]>=3.1,<4",
]
# Development tooling.
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.3,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Local package modules live at the repo root (ingest/, db/, transform/, ...).
packages = [
    "core",
    "ingest",
    "db",
    "transform",
    "alerts",
    "validation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# dashboard.py inserts the repo root into sys.path before importing project packages
# (needed on Streamlit Cloud); those imports carry inline `# noqa: E402` rather than a
# per-file-ignore, so suppression doesn't depend on config parsing across ruff versions.

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's *default* selection expands between versions (e.g.
# 0.16 promoted many rules to stable), which fails CI when the runner installs a newer
# ruff than the dev used. Selecting rules explicitly makes lint deterministic.
select = ["E4", "E7", "E9", "F"]
