# cryptodash configuration — externalized settings (CLAUDE.md section 10).
# Nothing here is hardcoded in Python: assets, IDs, thresholds and windows all live here.
#
# ID VERIFICATION STATUS (CLAUDE.md section 12):
#   All coingecko_id / defillama slugs below were verified against the live APIs
#   on 2026-07-22 (prices resolve on /simple/price; TVL resolves on /tvl/<slug>
#   and /v2/chains) and are marked `verified: true`. Re-verify if a slug is added
#   or a source renames it (section 9: "documentar de qué fuente sale cada número").

database:
  # Path is relative to the repo root; resolved by core.config. Never hardcoded in code.
  path: "cryptodash.db"

app:
  # Public/demo deploys must hide the real account (level 4). Overridable at runtime with
  # the PUBLIC_MODE env var (1/true), which is how a hosted instance turns it on.
  public_mode: false

logging:
  # Overridable at runtime via LOG_LEVEL env var (see core.logging_setup).
  level: "INFO"

# --- Data source parameters (all free; CLAUDE.md section 4) -------------------
sources:
  coingecko:
    base_url: "https://api.coingecko.com/api/v3"
    # Free tier ~30 req/min. Use batch endpoints; back off on 429.
    rate_limit_per_min: 30
    request_timeout_s: 20
    vs_currency: "usd"
  defillama:
    base_url: "https://api.llama.fi"
    request_timeout_s: 20
    # Keep this many days of historical TVL per protocol/chain (enough for 7/30/90d).
    history_days: 400
    # A7: agregado de stablecoins (host distinto, sin key). "Dry powder" = capital
    # aparcado listo para entrar a cripto (IDEAS_MEJORAS Parte A). series_id
    # `stablecoins:total_mcap`.
    stablecoins_base_url: "https://stablecoins.llama.fi"
    # A11: guardar la SERIE histórica de revenue por protocolo (no solo el snapshot 30d)
    # -> value-accrual como tendencia y MC/Revenue histórico. series_id `<slug>:revenue`.
    revenue_history_days: 400
  derivatives:
    # ccxt perpetual-swap data (Phase 2). Public endpoints, no key.
    exchanges: ["binance", "bybit"]
    quote: "USDT"                 # perp symbol = "<SYMBOL>/<quote>:<quote>"
    funding_history_days: 90      # funding is 8h; ~270 points -> z-score window
    oi_history_days: 30           # Binance OI-history endpoint caps ~30 days
    zscore_window_days: 90        # funding z-score window (§8, §2 nivel 2)
    # A3: Binance futures/data públicos (sin key). long_short = cuentas retail;
    # top_ls_* = cuentas top ("smart money"); taker_ratio = flujo agresor. Solo 1d
    # (disciplina anti-intradía). La divergencia retail vs. top es la señal jugosa.
    long_short_days: 30
    request_timeout_ms: 20000
  etf_flows:
    # Farside scraper (Phase 2). Fragile by design (§9): frozen HTML fixture + fail
    # loudly on structure change. Values are in USD millions.
    base_url: "https://farside.co.uk"
    assets: ["btc", "eth"]        # -> https://farside.co.uk/btc/ , /eth/
    request_timeout_s: 25
    user_agent: "cryptodash/0.1 (personal research dashboard; contact via repo)"
  binance_account:
    # READ-ONLY account sync (level 4: real holdings + trade history).
    # Keys from BINANCE_API_KEY / BINANCE_API_SECRET (never here). If absent, skipped.
    # NEVER enable trading/withdrawal on the key; the panel only reads (§2, §11).
    quote: "USDT"                 # trade pairs scanned: "<SYMBOL>/USDT"
    trades_since_days: 180        # how far back to pull executed trades
    dust_threshold_usd: 1.0       # ignore balances worth less than this
    request_timeout_ms: 20000
    # Wallets to include in holdings. spot/funding/earn need only READ permission.
    # "earn" reads Simple Earn (flexible+locked) positions directly — authoritative,
    # unlike the LD-prefixed amounts inside spot which can be stale. LD duplicates are
    # excluded from spot automatically (per asset present in Earn) to avoid double count.
    # WARNING: "future"/"delivery" require "Enable Futures" (also permits trading) and
    # contradict the no-leverage rule (§11); off by default. Spot Grid trading bots are
    # NOT readable with a read-only key (Binance requires the trading permission) — record
    # that capital via `manual_holdings` in the LOCAL override (see below).
    wallets: ["spot", "funding", "earn"]
    # Price non-tracked held assets by their CoinGecko id (symbol -> id). WBETH is
    # liquid-staked ETH and trades ABOVE ETH (accrued rewards), so price it directly,
    # not as ETH. The coingecko ingester fetches these ids too.
    price_aliases:
      WBETH: wrapped-beacon-eth
      # BNSOL is Binance liquid-staked SOL; it trades ABOVE SOL (accrued staking rewards),
      # so it gets its OWN price, not SOL's. Without this it shows no price and vanishes
      # from value/drift/risk/PnL (INVERSOR_IDEAS §2.2).
      BNSOL: binance-staked-sol
    # Classify a held-but-untracked symbol UNDER a tracked symbol for ALLOCATION grouping
    # (tier + thesis category), while keeping its OWN price above. WBETH is wrapped/staked
    # ETH, so it counts as ETH (núcleo) in the drift-vs-objetivo and allocation donuts —
    # not as "Sin tramo"/"Otros". This is classification only, never price (§ IDEAS_MEJORAS B4).
    symbol_aliases:
      WBETH: ETH
      # BNSOL counts as SOL for tramo/drift/riesgo (the second line INVERSOR_IDEAS §2.2 requires:
      # own price above, but grouped as SOL so it doesn't fall in "Sin tramo" and skew drift).
      BNSOL: SOL
    # Liquid-staking wrappers (a receipt for the base asset, not the base asset): flagged in the
    # positions table and counted in the non-price-risk table (INVERSOR_IDEAS §2.5/§4.1). Extra
    # risks vs. the underlying: discount to NAV, contract/validator risk, issuer dependence.
    staking_wrappers: ["BNSOL", "WBETH"]
    # `manual_holdings` (real positions the read-only key can't see) is PERSONAL data and
    # must NOT live in this tracked/public file. Put it in the gitignored
    # `config/settings.local.yaml` (template: `config/settings.local.yaml.example`), which
    # is deep-merged over this file at load time.
  # A5: Deribit (opciones) — API pública sin key. DVOL = "VIX de cripto" (vol implícita).
  # Snapshot diario, disciplina anti-intradía (IDEAS_MEJORAS Parte A, sección 2).
  deribit:
    base_url: "https://www.deribit.com/api/v2"
    currencies: ["BTC", "ETH"]
    dvol_history_days: 90
    request_timeout_s: 20
  # A6: Fear & Greed (Alternative.me) — gratis, sin key, histórico diario. Sentimiento
  # agregado; usar contrarian y como contexto SEMANAL, no destacado (sección 2).
  fear_greed:
    base_url: "https://api.alternative.me/fng/"
    history_days: 120
    request_timeout_s: 20
  # A8: precios spot multi-exchange (vía ccxt, sin key) para el "Coinbase premium" =
  # demanda US spot institucional. Solo BTC/ETH, cierre diario (sección 2).
  spot_prices:
    exchanges: ["coinbase", "binance"]
    assets: ["BTC", "ETH"]
    quotes: {coinbase: "USD", binance: "USDT"}
    history_days: 30
    request_timeout_ms: 20000
  # A10: fundamental on-chain de BTC (Blockchain.com charts) — gratis, sin key.
  # Sustituto PARCIAL de métricas on-chain de pago (no MVRV/SOPR). series_id `btc:<chart>`.
  blockchain_com:
    base_url: "https://api.blockchain.info/charts"
    charts: ["hash-rate", "difficulty", "n-transactions", "n-unique-addresses", "miners-revenue"]
    timespan: "1year"
    request_timeout_s: 25
  fred:
    # API key comes from FRED_API_KEY env var, never stored here.
    request_timeout_s: 20
    # Drop reference dates before this when fetching initial releases.
    observation_start: "2015-01-01"
    # Calendario de releases macro (endpoint gratuito FRED release/dates). release_id
    # verificado contra la API en vivo (2026-07-25). Alimenta el strip de "próximos
    # eventos" y la regla de alerta macro_release_soon.
    releases:
      - {release_id: 10, label: "CPI"}
      - {release_id: 54, label: "PCE (Personal Income & Outlays)"}
      - {release_id: 50, label: "NFP (Employment Situation)"}
    releases_horizon_days: 45   # cuánto futuro traer del calendario de releases
    # Each series: code (FRED id), label (display name), description (hover tooltip
    # shown in the dashboard). Labels/descriptions live here, never hardcoded (§10).
    series:
      cpi:
        code: "CPIAUCSL"
        label: "CPI"
        description: "Índice de Precios al Consumidor (urbano). Inflación general; al alza cuando los precios suben."
        # crypto_effect: cómo afecta a cripto una SUBIDA del indicador.
        # inverse = subida es bajista para cripto; direct = subida es alcista.
        crypto_effect: inverse   # inflación ↑ → Fed más restrictiva → risk-off
      core_pce:
        code: "PCEPILFE"
        label: "Core PCE"
        description: "PCE subyacente (sin alimentos ni energía). Métrica de inflación preferida por la Fed."
        crypto_effect: inverse   # igual que CPI: inflación ↑ → bajista para cripto
      nfp:
        code: "PAYEMS"
        label: "NFP"
        description: "Nóminas no agrícolas (miles de empleos). Empleo total; mide la fortaleza del mercado laboral de EE. UU."
        # PAYEMS está en miles de personas: un +150K típico es ~0.1% del nivel, así
        # que el % es poco informativo. Mostramos el cambio absoluto (empleos añadidos).
        change_display: absolute
        change_unit: "K"   # el valor ya viene en miles, el delta crudo son miles de empleos
        crypto_effect: inverse   # empleo fuerte → menos recortes → bajista (empleo débil = alcista)
      fed_funds:
        code: "DFF"
        label: "Fed Funds"
        description: "Tasa efectiva de fondos federales. Tipo de referencia de la política monetaria de la Fed."
        crypto_effect: inverse   # tipos ↑ → risk-off → bajista para cripto
      dxy:
        code: "DTWEXBGS"
        label: "DXY"
        description: "Índice amplio del dólar. Dólar fuerte = viento en contra para activos de riesgo y cripto."
        crypto_effect: inverse   # dólar fuerte → viento en contra → bajista para cripto
      yield_curve:
        code: "T10Y2Y"
        label: "Curva 10A-2A"
        description: "Spread de tipos 10 años menos 2 años. Negativo (curva invertida) = señal históricamente recesiva."
        # Simplificación: empinándose/normalizando (subiendo) = sesgo risk-on; profundizar la
        # inversión (bajando) = señal recesiva. Ajustable si prefieres otra lectura.
        crypto_effect: direct
      # --- A2: condiciones financieras / crédito (IDEAS_MEJORAS Parte A) -------
      # Capturan "apetito por riesgo" mejor que el CPI aislado y lideran el risk-off
      # de cripto. Todas gratis por el mismo pipeline FRED.
      nfci:
        code: "NFCI"
        label: "NFCI"
        description: "Índice de condiciones financieras (Chicago Fed). >0 = condiciones restrictivas."
        crypto_effect: inverse   # condiciones restrictivas → risk-off → bajista
      hy_spread:
        code: "BAMLH0A0HYM2"
        label: "Spread HY"
        description: "Spread de crédito high yield (OAS, %). Ensanchándose = estrés/risk-off."
        crypto_effect: inverse   # spread ↑ = estrés de crédito → bajista para cripto
      real_yield_10y:
        code: "DFII10"
        label: "Real yield 10A"
        description: "Rendimiento real a 10 años (TIPS, %). Real yield ↑ = viento en contra para BTC 'oro digital'."
        crypto_effect: inverse   # rendimiento real ↑ → bajista para activos sin flujo
      vix:
        code: "VIXCLS"
        label: "VIX"
        description: "Volatilidad implícita del S&P 500. VIX ↑ = miedo cross-asset → risk-off."
        crypto_effect: inverse   # VIX ↑ = miedo → bajista para cripto
    # --- A1: liquidez neta de la Fed (IDEAS_MEJORAS Parte A) ------------------
    # Componentes que NO se muestran como filas macro sueltas: solo alimentan la serie
    # derivada `net_liquidity` (transform.indicators.fed_net_liquidity_series). El
    # ingester FRED las descarga igual que `series`. UNIDADES VERIFICADAS EN VIVO contra
    # el endpoint fred/series (2026-07-26): WALCL y WTREGEN en MILLONES; RRPONTSYD en
    # MILES DE MILLONES. `unit_scale` normaliza todo a MILES DE MILLONES de USD.
    liquidity_components:
      walcl:
        code: "WALCL"
        label: "Balance de la Fed (WALCL)"
        unit_scale: 0.001        # millones -> miles de millones
      tga:
        code: "WTREGEN"
        label: "Cuenta General del Tesoro (TGA)"
        unit_scale: 0.001        # millones -> miles de millones
      rrp:
        code: "RRPONTSYD"
        label: "Repos inversos overnight (ON RRP)"
        unit_scale: 1.0          # ya en miles de millones
    net_liquidity:
      # net = WALCL - TGA - RRP (todo en miles de millones tras unit_scale).
      unit: "USD (miles de millones)"
      crypto_effect: direct      # liquidez neta ↑ = viento de cola risk-on → alcista

# --- Tracked asset universe (CLAUDE.md section 5) ----------------------------
# tier: nucleo | satelite | riesgo_medio | riesgo_alto | observacion
# thesis_category groups assets by *failure mode*, not by ticker, to expose
# concentration disguised as diversification (section 5).
assets:
  - symbol: BTC
    coingecko_id: bitcoin
    tier: nucleo
    thesis_category: store_of_value
    verified: true
  - symbol: ETH
    coingecko_id: ethereum
    tier: nucleo
    thesis_category: l1_base
    verified: true
  - symbol: XRP
    coingecko_id: ripple
    tier: satelite
    thesis_category: payments
    verified: true
  - symbol: SOL
    coingecko_id: solana
    tier: riesgo_medio
    thesis_category: l1_high_perf
    defillama:
      kind: chain
      slug: Solana
    verified: true
  - symbol: LINK
    coingecko_id: chainlink
    tier: riesgo_medio
    thesis_category: oracle_infra
    verified: true
  - symbol: AAVE
    coingecko_id: aave
    tier: riesgo_medio
    thesis_category: defi_lending
    defillama:
      kind: protocol
      slug: aave
    verified: true
  - symbol: UNI
    # Sube de 'observacion' a 'riesgo_medio' para la asignación objetivo del DCA (Parte G,
    # G6.4 #3): cambio de postura consciente — su captura de valor depende de un fee switch
    # aún atascado. Anotado como riesgo, no veto.
    coingecko_id: uniswap
    tier: riesgo_medio
    thesis_category: dex
    defillama:
      kind: protocol
      slug: uniswap
    verified: true
  - symbol: ONDO
    coingecko_id: ondo-finance
    tier: riesgo_alto
    thesis_category: rwa
    defillama:
      kind: protocol
      slug: ondo-finance
    verified: true
  - symbol: XLM
    coingecko_id: stellar
    tier: riesgo_alto
    thesis_category: payments
    verified: true
  - symbol: HBAR
    coingecko_id: hedera-hashgraph
    tier: riesgo_alto
    thesis_category: l1_enterprise
    defillama:
      kind: chain
      slug: Hedera
    verified: true
  - symbol: SUI
    coingecko_id: sui
    tier: riesgo_alto
    thesis_category: l1_high_perf
    defillama:
      kind: chain
      slug: Sui
    verified: true
  - symbol: TAO
    coingecko_id: bittensor
    tier: riesgo_alto
    thesis_category: ai
    verified: true
  - symbol: BNB
    # NOTE (CLAUDE.md section 5): the coingecko_id is verified, but the burn
    # calendar and idiosyncratic regulatory status still need confirming before
    # BNB enters any decision — those are qualitative, not covered by the ID check.
    coingecko_id: binancecoin
    tier: observacion
    thesis_category: exchange
    verified: true

# --- Derived-indicator thresholds --------------------------------------------
# Placeholders to be calibrated after observing 2-4 weeks of real data
# (CLAUDE.md section 12 open decision). Kept in config, never in code.
# --- Calendario macro manual (FOMC) -------------------------------------------
# No hay release de datos FRED para las decisiones del FOMC, así que sus fechas se
# listan a mano (calendario oficial de la Fed en federalreserve.gov). CPI/PCE/NFP se
# obtienen automáticamente de FRED (sources.fred.releases). ISO YYYY-MM-DD.
# Cada reunión dura 2 días; se lista el **segundo día**, cuando se anuncia la decisión de
# tipos (~14:00 ET) y el mercado se mueve — la fecha correcta para "esperar hasta después".
# Calendario 2026 (D4): jun 16-17, jul 28-29, sep 15-16, oct 27-28, dic 8-9.
macro_calendar:
  fomc_dates:
    - "2026-06-17"
    - "2026-07-29"
    - "2026-09-16"
    - "2026-10-28"
    - "2026-12-09"

indicators:
  dilution_ratio_alert: 0.6   # circulating/max below this => high dilution risk (section 8, SUI case)
  funding_zscore_window_days: 90
  funding_zscore_high: 2.0    # crowded longs
  funding_zscore_low: -2.0    # crowded shorts, squeeze conditions
  tvl_drop_pct_7d_alert: 20.0 # possible thesis invalidation
  etf_flow_streak_days: 3     # consecutive negative days => alert
  # B5: un unlock que libera >= este % del circulante dentro de 30 d se marca en ROJO
  # (magnitud, no solo fecha; CLAUDE.md sección 5: "unlock > 5% del TVL/circulante").
  unlock_pct_alert: 5.0
  # --- B2/B3: riesgo de cartera (IDEAS_MEJORAS Parte B) -----------------------
  # Correlación de retornos, beta a BTC, volatilidad, drawdown, concentración (HHI) y
  # contribución al riesgo. Sobre precios propios (backfill), sin dependencia nueva.
  risk:
    window_days: 90          # ventana de retornos diarios para correlación/beta/vol
    annualization_days: 365  # cripto opera todos los días (no 252 como en bolsa)
    high_correlation: 0.8    # |ρ| ≥ esto = "misma apuesta" (concentración disfrazada, §5)
  # --- B1: semáforo de régimen (IDEAS_MEJORAS Parte B) -----------------------
  # Score compuesto y TRANSPARENTE de nivel 1+2. Cada señal vota +1 risk-on / 0
  # neutral / -1 risk-off; el total se clasifica con los umbrales de abajo. Pocos
  # componentes, pesos iguales fijos y dead-zones documentadas (anti-overfitting,
  # sección 9): NO se optimizan pesos sobre el histórico.
  regime:
    net_liquidity_dead_pct: 0.5   # |cambio 13 sem de liquidez neta| por debajo = neutral
    nfci_dead: 0.05               # |nivel NFCI| por debajo = neutral (>0 restrictivo = risk-off)
    hy_dead_pp: 0.10              # |cambio 4 sem del spread HY, pp| por debajo = neutral
    dxy_dead_pct: 0.5             # |cambio 4 sem de DXY, %| por debajo = neutral
    stablecoins_dead_pct: 0.5     # |cambio 30 d de stablecoins, %| por debajo = neutral
    funding_z_extreme: 2.0        # |z| por encima = voto de hacinamiento (froth/lavado)
    etf_streak_min: 2             # días de racha ETF para contar el voto
    risk_on_at: 2                 # score >= => risk-on
    risk_off_at: -2               # score <= => risk-off

# --- Recurring monthly contribution (CLAUDE.md sections 1, 2 level 4) ---------
dca:
  monthly_contribution_min_usd: 200

# --- Target allocation by tier (CLAUDE.md section 5; IDEAS_MEJORAS Parte B, B4) ------
# Pesos objetivo por tramo, en % del capital **invertido** (no del efectivo). Base para el
# drift vs. objetivo: rebalanceo por APORTACIÓN (añadir al tramo más infra-ponderado, no
# vender — ahorra comisiones y es más limpio fiscalmente). Suman 100.
portfolio:
  # Objetivo por TRAMO (vista B4). Actualizado a la cartera objetivo de 9 activos (Parte G):
  # más agresiva que §5 (núcleo 55→40). Consistente con target_weights_asset de abajo.
  target_weights:
    nucleo: 40
    satelite: 5
    riesgo_medio: 37.5   # SOL 10 + LINK 7.5 + AAVE 10 + UNI 10
    riesgo_alto: 12.5    # ONDO 7.5 + TAO 5
  drift_band_pp: 5   # marca ⚠ cuando |actual − objetivo| supera esto (puntos porcentuales)
  # Objetivo por ACTIVO (Parte G, G5.1) — % sobre el capital TOTAL, stables (CASH) incluidos.
  # Base del asignador del DCA (drift_vs_target_asset + dca_allocator). Suman 100.
  # ⚠️ El reparto BTC/ETH (30/10, tu decisión de G6.1); ajústalo aquí. CASH = munición para
  # el rebalanceo por bandas (§ G6.4 #6). Los activos fuera de esta lista no reciben aporte.
  target_weights_asset:
    BTC: 30.0
    ETH: 10.0
    XRP: 5.0
    AAVE: 10.0
    UNI: 10.0
    LINK: 7.5
    SOL: 10.0
    ONDO: 7.5
    TAO: 5.0
    CASH: 5.0
  tilt_cap_pct: 25   # tope duro del tilt de cheapness (capa 4, G5-c) — desactivado hasta validar
  # Límites de riesgo NO-precio (INVERSOR_IDEAS §4.1): contrapartida/custodia/emisor. La tabla
  # muestra siempre el % actual; el SEMÁFORO solo aparece donde fijes un umbral. El valor está en
  # escribir la política ANTES de que el riesgo se materialice (igual que las tesis). Todos
  # opcionales; descoméntalos y ajústalos a tu tolerancia. `*_max_pct` = techo; `*_min_pct` = piso.
  non_price_risk_limits:
    # exchange_max_pct: 100          # % máx. en un solo exchange (custodia)
    # stablecoin_issuer_max_pct: 30  # % máx. en el mayor emisor de stablecoin (Tether/Circle)
    # lent_max_pct: 20               # % máx. prestado (Earn — no custodiado)
    # wrappers_max_pct: 15           # % máx. en envoltorios de staking (LSD)
    # self_custody_min_pct: 20       # % mín. en autocustodia (llaves propias)

# --- Alerts (CLAUDE.md section 8, phase 3) -----------------------------------
# Declarative rules evaluated against the DB after ingest; only actionable, pre-written
# conditions fire (§2). Deduped per condition per day via alerts_log. Delivery via
# Telegram (TELEGRAM_TOKEN/CHAT_ID); dry-run/logged if unconfigured.
alerts:
  rules:
    - {id: etf_outflow_streak, kind: etf_outflow_streak, min_days: 3}
    - {id: funding_crowded,    kind: funding_crowded,    z_threshold: 2.0}
    - {id: tvl_drop,           kind: tvl_drop,           pct: 20}
    - {id: unlock_soon,        kind: unlock_soon,        within_days: 7}
    - {id: monthly_dca_reminder, kind: monthly_dca_reminder, day_of_month: 1}
    - {id: macro_release_soon, kind: macro_release_soon, within_days: 3}
    # Fiscal (local only; the evaluator no-ops unless fiscal.enabled). FISCAL.md §9.
    - {id: lot_maturity_soon,  kind: lot_maturity_soon,  within_days: 60}

# --- Thesis categories (CLAUDE.md section 5) ---------------------------------
# Brief explanation per thesis category, shown in the Tesis table. Diversification
# is by category / failure mode, not by ticker — this makes the grouping legible.
thesis_categories:
  store_of_value: "Reserva de valor; oro digital, sin flujo de caja propio del token."
  l1_base: "Capa base / infraestructura de contratos inteligentes."
  l1_high_perf: "L1 de alto rendimiento; compiten en velocidad y coste por transacción."
  l1_enterprise: "L1 orientada a empresas e instituciones."
  oracle_infra: "Oráculos e infraestructura que conecta datos del mundo real on-chain."
  defi_lending: "Préstamos DeFi; captura ingresos por intereses y comisiones de protocolo."
  dex: "Exchange descentralizado; ingresos por comisiones de trading."
  payments: "Redes de pagos y liquidación transfronteriza."
  rwa: "Activos del mundo real tokenizados (bonos, crédito privado)."
  ai: "IA descentralizada; cómputo y modelos coordinados on-chain."
  exchange: "Token de exchange; quemas ligadas al negocio del CEX (riesgo regulatorio)."
